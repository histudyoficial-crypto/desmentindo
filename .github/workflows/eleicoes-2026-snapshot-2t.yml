name: Eleições 2026 — snapshots da apuração oficial (TSE) · 2º turno

# Histórico da apuração (Presidente · Brasil · 2º turno, eleição 6258 / pleito 3221): FIRST_RESULT → HOURLY → FINAL, idempotente.
# SEM CRON: só roda por disparo manual (workflow_dispatch). Agendar exige autorização de Johnny (CLAUDE.md); o laço de
# 66 passadas × 5 min cobre 17h–22h30 de 25/10 a partir de um disparo às ~16h40. Grava presidente-br-2t.json;
# o arquivo do 1º turno (presidente-br.json) nunca é tocado por este workflow.
# ex_post=true: uma única leitura depois da apuração (--ex-post): grava FINAL só com tf = s, com a hora real da leitura e a
# lacuna da evolução escrita no arquivo; não cria FIRST_RESULT/HOURLY nem simula o horário de 25/10.
# Lê só o arquivo público de totalização do TSE e grava um JSON pequeno no branch de dados
# `eleicoes-2026-dados` (não é main: não dispara deploy nem toca o site). A página lê esse arquivo.
# Sem segredo além do GITHUB_TOKEN do próprio repo. Não publica conteúdo editorial.
on:
  workflow_dispatch:
    inputs:
      passadas:
        description: "Passadas de 5 min (66 ≈ 5h30; 1 = teste único)"
        default: "66"
        required: true
      ex_post:
        description: "Captura única do FINAL depois da apuração (só com tf = s; ignora passadas; hora real da leitura)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: eleicoes-2026-snapshot-2t
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Branch de dados
        run: |
          git config user.name "desmentindo-eleicoes[bot]"
          git config user.email "noreply@desmentindo.com.br"
          if git fetch -q origin eleicoes-2026-dados; then
            git worktree add -q dados FETCH_HEAD
            git -C dados checkout -q -B eleicoes-2026-dados
          else
            git worktree add -q --detach dados
            git -C dados checkout -q --orphan eleicoes-2026-dados
            git -C dados rm -rq . || true
            printf 'Dados públicos de apuração (TSE) do Desmentindo · Eleições 2026. Gerado por .github/workflows/eleicoes-2026-snapshot.yml.\n' > dados/README.md
          fi
      # Laço próprio (o cron do GitHub não disparou em 04/10): um snapshot a cada 5 min; o script é idempotente (grava no
      # máximo FIRST_RESULT, 1 por hora cheia BRT e FINAL; o resto é SKIP e não gera commit). Falha de rede = nada gravado.
      - name: Snapshot e gravação (só se mudou)
        env:
          LOOP: ${{ inputs.passadas }}
          EX_POST: ${{ inputs.ex_post }}
        run: |
          case "$LOOP" in ''|*[!0-9]*) echo "passadas inválido"; exit 1;; esac
          [ "$LOOP" -le 80 ] || { echo "passadas acima do limite (80)"; exit 1; }
          FLAG=""; if [ "$EX_POST" = "true" ]; then LOOP=1; FLAG="--ex-post"; fi   # ex post = uma leitura só, nunca o laço
          for n in $(seq 1 "$LOOP"); do
            python3 public-ui/eleicoes_snapshot.py --eleicao 6258 --out dados/presidente-br-2t.json $FLAG || echo "snapshot falhou nesta passada"
            ( cd dados
              git add -A
              if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
              git commit -q -m "eleicoes-2026: snapshot 2T $(python3 -c "import json;d=json.load(open('presidente-br-2t.json'));s=d['snapshots'];print((s[-1]['kind']+' '+str(s[-1]['percent_totalized'])) if s else 'sem snapshot')")"
              for i in 1 2 3; do
                git push -q origin eleicoes-2026-dados && exit 0
                sleep $((i*5)); git fetch -q origin eleicoes-2026-dados && git rebase -q FETCH_HEAD || true
              done
              exit 1 ) || echo "push falhou nesta passada"
            if [ -f dados/presidente-br-2t.json ] && python3 -c "import json,sys;sys.exit(0 if (json.load(open('dados/presidente-br-2t.json')).get('summary') or {}).get('final_captured') else 1)"; then echo "FINAL registrado"; break; fi
            if [ "$n" -lt "$LOOP" ]; then sleep 300; fi
          done
