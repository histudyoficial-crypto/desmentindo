name: Diagnostico FTP Locaweb

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostico via ftplib
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - << 'PYEOF' > ftp_diag.txt 2>&1 || true
          import ftplib, os, traceback
          def safe(label, fn):
              print(f"--- {label} ---")
              try:
                  fn()
              except Exception as e:
                  print(f"ERROR in {label}: {e!r}")
                  traceback.print_exc()

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          pw = os.environ['FTP_PASSWORD']

          try:
              ftp = ftplib.FTP()
              ftp.connect(host, 21, timeout=30)
              print("connected ok")
              ftp.login(user, pw)
              print("login ok")
              print("welcome:", ftp.getwelcome())
              print("pwd:", ftp.pwd())

              def do_list_cwd():
                  lines = []
                  ftp.retrlines('LIST', lines.append)
                  for l in lines: print(l)
              safe("LIST cwd", do_list_cwd)

              def do_list_root():
                  lines = []
                  ftp.retrlines('LIST /', lines.append)
                  for l in lines: print(l)
              safe("LIST /", do_list_root)

              def do_list_ph():
                  lines = []
                  ftp.retrlines('LIST public_html', lines.append)
                  for l in lines: print(l)
              safe("LIST public_html", do_list_ph)

              def do_list_ph_img():
                  lines = []
                  ftp.retrlines('LIST public_html/img', lines.append)
                  for l in lines[:8]: print(l)
                  print("total entries:", len(lines))
              safe("LIST public_html/img", do_list_ph_img)

              ftp.quit()
          except Exception as e:
              print("TOP LEVEL ERROR:", repr(e))
              traceback.print_exc()
          PYEOF
          echo "python exit status: $?"
          echo "=== file content ==="
          cat ftp_diag.txt || echo "(sem arquivo)"

      - name: Commit diagnostico
        if: always()
        run: |
          git config user.name "Desmentindo Bot"
          git config user.email "desmentindo@users.noreply.github.com"
          if [ ! -f ftp_diag.txt ]; then echo "(diagnostico nao gerado)" > ftp_diag.txt; fi
          git add ftp_diag.txt
          git commit -m "Diagnostico FTP" || echo "nada para commitar"
          git push || echo "push falhou"
