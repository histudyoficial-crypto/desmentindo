name: Diagnostico FTP Locaweb

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostico via ftplib
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 << 'PYEOF' > ftp_diag.txt 2>&1
          import ftplib, os
          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          pw = os.environ['FTP_PASSWORD']
          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=30)
          ftp.login(user, pw)
          print("welcome:", ftp.getwelcome())
          print("pwd:", ftp.pwd())
          print("--- LIST of cwd ---")
          lines = []
          ftp.retrlines('LIST', lines.append)
          for l in lines: print(l)
          print("--- LIST of / ---")
          try:
              lines2 = []
              ftp.retrlines('LIST /', lines2.append)
              for l in lines2: print(l)
          except Exception as e:
              print("err listing /:", e)
          print("--- LIST of public_html (if exists) ---")
          try:
              lines3 = []
              ftp.retrlines('LIST public_html', lines3.append)
              for l in lines3: print(l)
          except Exception as e:
              print("err listing public_html:", e)
          print("--- LIST of public_html/img (if exists) ---")
          try:
              lines4 = []
              ftp.retrlines('LIST public_html/img', lines4.append)
              for l in lines4[:5]: print(l)
              print("...", len(lines4), "entries")
          except Exception as e:
              print("err listing public_html/img:", e)
          ftp.quit()
          PYEOF
          cat ftp_diag.txt

      - name: Commit diagnostico
        run: |
          git config user.name "Desmentindo Bot"
          git config user.email "desmentindo@users.noreply.github.com"
          git add ftp_diag.txt
          git commit -m "Diagnostico FTP" || echo "nada para commitar"
          git push
