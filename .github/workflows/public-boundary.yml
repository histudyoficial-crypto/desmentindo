name: Fronteira pública — validar

# Garante que nada operacional/privado entre no repositório público.
# Só valida: sem deploy, sem schedule, permissões de leitura.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: public-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Caminhos privados não podem existir aqui
        run: |
          bad=0
          for p in control operations reports command-center; do
            if [ -e "$p" ]; then echo "Caminho privado no repo público: $p/"; bad=1; fi
          done
          exit $bad
      - name: Campos internos e scores de pessoa não podem aparecer nos arquivos públicos novos
        run: |
          for d in v4 v5; do
            if [ -d "$d" ] && grep -R -n -I -E '"(review_reason|decision_ref|human_review|HUMAN_REVIEW_QUEUE|incident_id|person_score|political_score|suspicion_score|wrongdoing_score|controversy_score|person_ranking|person_watchlist)"' "$d/"; then
              echo "Campo interno/proibido encontrado em $d/."; exit 1
            fi
          done
      - name: Marcadores privados/de teste não podem aparecer na v5
        run: |
          if [ -d v5 ] && grep -R -n -I -E 'AUTONOMOUS_TEST_RUN|RV-20[0-9]{6}-[0-9]{3}|DS-20[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{3}|EVC-20[0-9]{6}-[0-9]{3}|WAITING_REVIEW|desmentindo-ops|MORNING_OPEN|LEGACY_PROJECT_MORNING|ANTHROPIC_API_KEY' v5/; then
            echo 'Marcador privado encontrado em v5/.'; exit 1
          fi
      - name: Nenhum segredo em texto
        run: |
          if git ls-files -z | xargs -0 grep -I -n -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' ; then
            echo 'Possível segredo versionado.'; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dados da v4 em sincronia com o app legado
        run: |
          if [ -f public-ui/build-public-data.mjs ]; then
            node public-ui/build-public-data.mjs --check
          fi
      - name: Dados da v5 em sincronia com os dados públicos
        run: |
          if [ -f public-ui/build-v5-data.mjs ]; then
            node public-ui/build-v5-data.mjs --check
          fi
