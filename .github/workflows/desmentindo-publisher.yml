name: Desmentindo Publisher

# Unattended discovery + validation + Pull Request preparation for the
# Autonomous Publishing Bridge (Vault -> this repo -> Locaweb deploy).
#
# This workflow NEVER pushes to `main` and NEVER merges a Pull Request.
# It only opens/updates PRs from validated Publication Candidates found
# in the Dropbox Vault production outbox. A human must review and merge
# each PR on GitHub for the change to reach `main` (and from there the
# existing deploy-locaweb.yml workflow takes it to desmentindo.com.br).
#
# Cadence: hourly. GitHub Actions cron is always UTC; the operational
# reference timezone for this project is America/Sao_Paulo.
# Minute 17, not 0: scheduled events at the top of the hour are the ones
# GitHub delays or drops under load (19/10/2026: ~1 run every 3.4 h with
# '0 * * * *'). The runtime records the gap since the previous run.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desmentindo-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Identidade dos PRs (04/11/2026). PR aberto com o GITHUB_TOKEN sai como github-actions[bot], e o GitHub
      # segura a CI desse PR em `action_required` até alguém aprovar o run (todos os PRs do Publisher desde
      # 21/10 esperaram de 20 h a 6 dias). Com um GitHub App dedicado, o PR sai com a identidade do App e a CI
      # "Fronteira pública — validar" roda sozinha. O App só tem Contents e Pull requests (sem Actions, sem
      # Workflows: não dispara workflow nem altera .github/). Sem a variável PUBLISHER_APP_ID nada muda:
      # o passo é pulado e segue o GITHUB_TOKEN. Merge continua humano.
      - name: Token do Publisher (GitHub App dedicado, se configurado)
        id: app
        if: ${{ vars.PUBLISHER_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Desmentindo Publisher (discover, validate, open/update PRs)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          PUBLISHER_AUTH: ${{ steps.app.outputs.token && 'GITHUB_APP' || 'GITHUB_TOKEN' }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python3 automation/publisher_runtime.py
