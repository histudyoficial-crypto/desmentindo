name: Control Plane — validar

# Só valida. Não publica, não faz deploy, não tem schedule.
on:
  pull_request:
    paths:
      - 'control/**'
      - 'operations/**'
      - 'reports/**'
      - 'command-center/**'
      - 'CLAUDE.md'
  push:
    branches: [main]
    paths:
      - 'control/**'
      - 'operations/**'
      - 'reports/**'
      - 'command-center/**'
      - 'CLAUDE.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: control-plane-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Schemas, invariantes, bundle e varredura de segredos
        run: python3 operations/tools/ctl.py validate
      - name: Self-test do ctl.py (casos negativos)
        run: python3 operations/tools/test_ctl.py
      - name: Command Center não pode referenciar credenciais nem APIs com token
        run: |
          if grep -R -n -i -E 'authorization|access_token|api\.github\.com|localStorage\.setItem\([^)]*token' command-center/; then
            echo 'Command Center não pode usar credenciais no browser.'; exit 1
          fi
