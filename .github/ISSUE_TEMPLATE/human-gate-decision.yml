name: Human Gate — decisão
description: Decisão de Johnny sobre um item de Human Review ou da fila de decisões.
title: "[HUMAN_GATE] <RV-… ou DQ-…> <APPROVE|REQUEST_CHANGES|HOLD|REJECT>"
labels: ["human-gate"]
body:
  - type: input
    id: item
    attributes:
      label: Item
      description: review_id (RV-AAAAMMDD-NNN) ou item_id (DQ-NNNN)
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Decisão
      options: [APPROVE, REQUEST_CHANGES, HOLD, REJECT]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Observações
      description: O que mudar, por que segurar, ou condições da aprovação.
