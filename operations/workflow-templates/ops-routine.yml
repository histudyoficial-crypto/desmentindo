# TEMPLATE — NÃO INSTALADO. Não está em .github/workflows/, então não roda.
# Instalar somente depois do ciclo manual aprovado por Johnny (registrar em control/DECISIONS.md).
# Requer o secret ANTHROPIC_API_KEY (Johnny cadastra pessoalmente).
name: Desmentindo Ops Routine

on:
  workflow_dispatch:
    inputs:
      routine:
        description: Rotina
        required: true
        type: choice
        options: [MORNING_OPEN, AFTERNOON_UPDATE, EVENING_CLOSE]
  # schedule:   # America/Sao_Paulo = UTC-3 → 07:00/14:00/21:00 BRT
  #   - cron: '0 10 * * *'   # MORNING_OPEN
  #   - cron: '0 17 * * *'   # AFTERNOON_UPDATE
  #   - cron: '0 0 * * *'    # EVENING_CLOSE

permissions:
  contents: write
  issues: write

# Uma rotina por vez, nunca cancelando a que está em andamento.
concurrency:
  group: desmentindo-ops
  cancel-in-progress: false

jobs:
  routine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo
      ROUTINE: ${{ inputs.routine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pré-validação do Control Plane
        run: python3 operations/tools/ctl.py validate
      - name: Adquirir lock (compare-and-swap via push)
        run: |
          git config user.name "Desmentindo Ops"
          git config user.email "ops@desmentindo.local"
          RUN_ID=$(python3 operations/tools/ctl.py lock acquire "$ROUTINE" --holder "gha-${{ github.run_id }}")
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          git commit -am "ops(lock): $ROUTINE $RUN_ID"
          git push origin HEAD:main
      - name: Executar rotina com Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx -y @anthropic-ai/claude-code -p "$(cat operations/prompts/$ROUTINE.md) RUN_ID=$RUN_ID" \
            --allowedTools "Read,Edit,Write,Bash(python3 operations/tools/ctl.py:*),Bash(git:*)"
      - name: QA final
        run: python3 operations/tools/ctl.py validate
      - name: Liberar lock em falha
        if: failure()
        run: |
          git pull --rebase origin main || true
          python3 operations/tools/ctl.py lock release --run-id "$RUN_ID" --force
          git commit -am "ops(lock): release after failure $RUN_ID" && git push origin HEAD:main || true
